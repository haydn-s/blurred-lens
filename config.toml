# Blurred Lens configuration. Secrets (API keys) go in .env, never here.

[prompts]
# {place} and {view} come from data/places.json ("phrase", "view"), {country} from data/countries.json
# ("prompt_name"). {view} fixes the camera position for each kind of place, so every image of a prompt
# shares one perspective and the images line up when they are compared.
countries_file = "data/countries.json"
places_file = "data/places.json"

# Which condition `generate` uses when --condition says nothing. See [prompts.conditions] below.
condition = "free"

# The scope of a run: which entries of those files it uses. Empty lists mean all of them, and
# --countries / --places override these. A baseline condition ignores the country list.
#
# Phase 2: 60 countries, 15 in each World Bank income group (data/income_groups.json), sized and
# chosen from the pilot's measured noise rather than by hand. Three constraints shaped the list.
#
#   Income must not stand in for latitude. Across the 195 countries with an income group the rich
#   ones sit far from the equator and the poor ones near it -- mean |latitude| 37° against 14° -- so
#   "warmer because poorer" and "warmer because nearer the equator" would be one sentence. Pairing
#   hot high-income countries (Singapore, Panama, Costa Rica, Trinidad and Tobago, the Gulf states)
#   against cool or highland poor ones (North Korea, Syria, Afghanistan, Uzbekistan, the Ethiopian
#   and Rwandan highlands) closes the gap between the richest and poorest groups to 9.4°, and puts
#   all four income groups on both sides of 20°, so `report` can hold latitude constant by
#   interpolating rather than extrapolating. Spearman(income rank, |latitude|) is 0.24 here against
#   0.46 for the world.
#
#   Countries have to be ones the model has seen. Every country here has at least a million people.
#   Without that floor the arithmetic prefers tropical micro-states -- Nauru, Palau, Tuvalu -- which
#   balance latitude perfectly and carry none of the stereotypes this project is about.
#
#   A reader has to find the countries they came to look for. The United States, Germany, Japan,
#   Norway, Brazil, Mexico, China, India, Nigeria, Egypt, Ethiopia, Afghanistan and North Korea are
#   fixed in the list; the rest were chosen around them to balance latitude.
#
# Why 60 and not more: countries are the unit of the statistical test, so power rises with them, but
# the supply of warm rich and cool poor countries runs out. At 72 countries the income-latitude
# correlation climbs to 0.31 and at 84 to 0.40, close to the world's own 0.46 -- buying power by
# giving back the thing the design exists to establish. 60 holds the confound at the level of the
# hand-picked phase-1 list while raising the power to detect a large income effect from 66% to 76%.
countries = [
  # High income
  "AUS", "BHR", "CRI", "DEU", "JPN", "KWT", "NOR", "OMN", "PAN", "QAT", "SAU", "SGP", "TTO", "ARE", "USA",
  # Upper middle income
  "DZA", "BRA", "CHN", "COL", "CUB", "ECU", "IRN", "KAZ", "MEX", "MKD", "PER", "PHL", "ZAF", "LKA", "TUR",
  # Lower middle income
  "BGD", "CIV", "DJI", "EGY", "GHA", "IND", "KEN", "MAR", "NAM", "NGA", "PAK", "PNG", "TLS", "TUN", "UZB",
  # Low income
  "AFG", "BDI", "TCD", "ERI", "ETH", "MDG", "MLI", "MOZ", "NER", "PRK", "RWA", "SOM", "SYR", "UGA", "YEM",
]
# Six kinds of place, spanning dense urban, small urban, rural settlement, a single building, open
# landscape and commerce. Places cost nothing in precision: a country's index is the average of its
# per-place scores, so the noise on it falls as sqrt(places x images) -- six places at 84 images each
# is exactly as precise as three at 168, and says the grade holds across six kinds of scene instead
# of three. `suburb` and `farm` are left out as near-duplicates of `village` and `rural`.
places = ["city", "town", "village", "house", "rural", "market"]

# A condition is a prompt template, and it is the one thing a run is allowed to vary. Each condition
# writes to its own run folder (outputs/<run_name>-<condition>/), so two sentences can never end up in
# the same average, and `generate --condition <name>` picks one.
#
#   free            what the model does when only the country, the place and the camera are fixed.
#   noon            the same sentence with the light pinned: same hour, same sky, same sun height.
#                   The free run cannot tell a grade from a scene choice -- a country that measures
#                   warm may be warm because the model reached for golden hour. Nothing here names a
#                   color, so if the warmth gap survives this control it is a grade laid over the
#                   frame rather than the time of day the model chose to draw.
#   baseline        the same places with no country at all: the model's own default picture of a city,
#                   a village, a house. One prompt per place, filed under _none, so each country can
#                   be read as a deviation from that default and not only from the average country.
#                   Its run folder holds no countries, so `report` has nothing to rank there; the
#                   numbers live in analysis/_none/<place>.json.
#   baseline_noon   the baseline under the same pinned light, so a light-controlled country has a
#                   light-controlled default to be compared with.
#
# Keep this table last in [prompts]: in TOML every key after a sub-table header belongs to it.
[prompts.conditions]
free = "A photograph of {place} in {country}, {view}."
noon = "A photograph of {place} in {country}, {view}, at noon under a clear sky with the sun high overhead."
baseline = "A photograph of {place}, {view}."
baseline_noon = "A photograph of {place}, {view}, at noon under a clear sky with the sun high overhead."

[generation]
# Output folder under outputs/. The condition is appended (outputs/phase2-free, outputs/phase2-noon,
# ...), so a template change always lands in its own folder. Start a new name whenever you change the
# model or the size, so images from different setups are never compared.
run_name = "phase2"
# 84 per prompt, from the pilot's measured noise rather than a guess: at 6 places that leaves a
# country's index measured to about a 25th of the spread between countries, so 97% of a real group
# difference survives the measurement under the free prompt and 99% under the light control. More
# images buy almost nothing from there -- the index already averages six places -- which is why the
# budget went to countries and places instead. `python -m blurred_lens.sizing --run phase2-noon`
# re-checks this against whatever is on disk.
images_per_prompt = 84

# Budget: the most this run may cost in total (USD), counting images already on disk. It is split
# evenly: every prompt gets the same number of images, so every country and place is measured from the
# same sample size and the comparison stays fair. Raise it later and a re-run tops every prompt up.
# 0 = no budget (generate images_per_prompt). Needs price_per_image_usd. The budget is per run, and
# each condition is a run, so four conditions cost four budgets.
budget_usd = 95.0             # per run, and a condition is a run: ~$91 each for free and noon,
                              # ~$1.51 for each baseline, ~$185 for the four together
min_images_per_prompt = 20    # a budget that buys fewer than this per prompt is refused

# Replicate (https://replicate.com). The API token decides which account pays, so use a token
# created while switched to the organization that funds this work, and put it in .env.
provider = "replicate"        # replicate | openai
model = "black-forest-labs/flux-schnell"
api_key_env = "REPLICATE_API_TOKEN"
price_per_image_usd = 0.003   # flux-schnell: $3 per 1,000 output images
count_param = "num_outputs"   # the model input that asks for several images in one prediction
wait_seconds = 60             # "Prefer: wait" holds the request open until the prediction is done

# The exact model version every image of this run must come from. Replicate reports the version that
# answered each prediction; if it ever differs from this, the run stops instead of quietly mixing two
# models' pictures into one measurement. Read the current one at
# https://replicate.com/black-forest-labs/flux-schnell/api (or GET /v1/models/<owner>/<model>).
# Empty = don't pin, but still stop if the version changes part-way through a run.
model_version = "c846a69991daf4c0e5d016514849d14ee5b2e6846ce6b9d6f21369e564cfe51e"

# Reproducibility: image i of every prompt is generated with seed seed_base + i, and the seed is
# written into metadata.jsonl, so any single image can be made again. The seed depends on the image
# number alone, not on the country or the condition, so image 7 of Norway's city, of Nigeria's city
# and of the no-country baseline all start from the same noise: the country name is then the only
# difference between them, in the sampling as well as in the sentence.
# 0 = no seed (the model picks its own). Needs images_per_request = 1, because a model handed one seed
# for a batch of four decides the other three itself.
seed_base = 1000
seed_param = "seed"           # the model input that takes it ("" if the model has none)

# An OpenAI-compatible /images/generations endpoint instead (OpenAI, a LiteLLM gateway, ...):
# provider = "openai"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# model = "gpt-image-1-mini"

# Every image in a run is saved at exactly this size. It is sent with each request, and an image that
# comes back at another size is center-cropped and resized (its returned size is logged). One size for
# the whole project: the measurements are scale-sensitive, 1024x1024 is supported by every major image
# model, and on flux-schnell a square megapixel costs no more than a quarter of one.
size = "1024x1024"
quality = "low"               # openai provider only: gpt-image-* low | medium | high
images_per_request = 1        # images per request; 1 is required while seed_base is set
# Replicate allows 600 prediction creations a minute. 550 leaves headroom so the run is not fighting
# rate limits at the ceiling: a 429 is retried and costs no money, but it costs time. Concurrency has
# to keep up with the throttle or it becomes the real limit -- sustaining R requests a minute at L
# seconds of round-trip latency needs about R*L/60 in flight, so ~14 at 550/min and 1.5s. The phase-1
# pilot ran at 291/min against a 300 throttle with 8 in flight, which is that arithmetic holding.
concurrency = 16              # requests in flight at once
requests_per_minute = 550     # client-side throttle; Replicate allows 600 predictions/min
save_format = "jpeg"          # jpeg | webp | png (png is ~6x larger on disk)

# Passed straight through as the model's Replicate input, alongside the prompt. Every model has
# its own schema (https://replicate.com/<owner>/<model>/api/schema), so change these with the model.
[generation.input]
aspect_ratio = "1:1"          # 1 megapixel at 1:1 -> 1024x1024
megapixels = "1"              # "1" | "0.25"
num_inference_steps = 4       # 1-4; 4 is the model's own default, pinned here so runs are documented
output_format = "jpg"         # "webp" | "jpg" | "png"
output_quality = 90           # 0-100
go_fast = true                # the model's fp8 fast path; keep it the same for a whole run

[analysis]
# Every generated image is measured at this width, so metrics that depend on scale (edge density,
# the haze window) stay comparable whatever size the model returned.
width = 512
min_spread = 3.0              # leave out near-blank frames (pixel standard deviation below this); 0 keeps all

[site]
samples_per_prompt = 8        # individual images shown per prompt on the website
thumbnail_size = 256

[report]
# The comparison across countries. The headline metric is the one countries are ranked by; every
# other measurement is still reported alongside it.
metric = "cast_b"             # yellow-blue cast on the picture as a whole; higher is more yellow
income_file = "data/income_groups.json"
permutations = 10000          # label shuffles behind each group comparison's p-value

# The run holding the no-country baseline for the run being reported, so each country is read as a
# deviation from the model's own default picture of a place and not only from the average country.
# Match the light: report a `noon` run against `phase2-baseline-noon`, a free one against
# `phase2-baseline`. "" = no baseline column; --baseline overrides.
baseline_run = ""

# Rival explanations held constant when every group test is repeated, naming fields in
# countries_file. Latitude enters as distance from the equator and rainfall on a log scale, because
# the gap between 100mm and 200mm of rain changes how a place looks far more than 2,000mm to 2,100mm.
# Rainfall is here because the phase-2 run found latitude explains almost nothing (1-5%) while the
# warmest countries were the dry ones, so aridity, not latitude, is the confound to beat.
# Available: latitude, precipitation_mm, forest_pct, population. [] = no control.
controls = ["latitude", "precipitation_mm"]

[paths]
outputs_dir = "outputs"
site_data_dir = "web/data"
